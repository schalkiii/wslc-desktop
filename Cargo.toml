[package]
name = "wslc-desktop"
version = "0.1.0"
edition = "2021"
description = "A native GUI to manage Microsoft WSL Containers (wslc.exe)"
license = "MIT"
repository = "https://github.com/schalkiii/wslc-desktop"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
egui_plot = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Same rasterizer egui uses internally; lets us verify the bundled CJK font
# parses and contains the glyphs we need.
ab_glyph = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
