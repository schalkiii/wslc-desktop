name: Release

# Build a Windows release executable and publish it as a GitHub release asset.
# Triggered automatically when a `v*` tag is pushed, or manually via the
# Actions tab ("Run workflow").

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The repo ships a `.cargo/config.toml` that points crates.io at the
      # rsproxy.cn mirror for the developer's local (domestic) network. On the
      # GitHub runner that mirror is unreachable, so fall back to upstream
      # crates.io for the CI build.
      - name: Use upstream crates.io for CI
        shell: bash
        run: |
          if [ -f .cargo/config.toml ]; then
            mv .cargo/config.toml .cargo/config.toml.ci_bak
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/wslc-desktop.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
